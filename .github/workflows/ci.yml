name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: "ci-placeholder-password"
      ADMIN_SESSION_SECRET: "ci-placeholder-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Types (TypeScript)
        run: bunx tsc --noEmit

      - name: Build de production
        run: bun run build
