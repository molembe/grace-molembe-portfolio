# Reverse proxy Nginx — portfolio Grace à Dieu MOLEMBE
# Point d'entrée unique : TLS, headers de sécurité, cache statique, gzip.

upstream portfolio_app {
    server app:3000;
}

# ---------- Redirection HTTP -> HTTPS (+ réponses ACME) ----------
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Site principal ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificats (Let's Encrypt via certbot, ou propres).
    ssl_certificate     /etc/letsencrypt/live/portfolio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio/privkey.pem;

    # TLS moderne uniquement.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # HSTS — après validation du fonctionnement HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache long pour les assets versionnés de Next.js.
    location /_next/static/ {
        proxy_pass http://portfolio_app;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Assets publics (images, documents, icônes).
    location ~* ^/(images|projects|documents|diagrams)/ {
        proxy_pass http://portfolio_app;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Taille max des requêtes (formulaire de contact limité côté app).
    client_max_body_size 64k;

    location / {
        proxy_pass http://portfolio_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
