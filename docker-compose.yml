# Portfolio Engineering — Grace à Dieu MOLEMBE
# Déploiement production : Next.js + Nginx (TLS) + certbot (Let's Encrypt).
#
# Usage :
#   1. cp .env.example .env       puis renseigner les valeurs
#   2. docker compose build
#   3. docker compose up -d
#   4. Certificat initial : docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d VOTRE_DOMAINE
#   5. docker compose restart nginx

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Back-office /admin (mot de passe fort requis ; vide = back-office désactivé)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
    volumes:
      # Contenu édité via le back-office + photo + messages de contact.
      - app-data:/app/.data
    networks:
      - internal
    # Aucun port publié : Nginx est le seul point d'entrée.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # Renouvellement deux fois par jour (no-op si rien à renouveler).
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  app-data:
  certbot-www:
  certbot-conf:

networks:
  internal:
    driver: bridge
